# Automatische Updates für Abhängigkeiten (wöchentlich, gebündelt)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      dev-dependencies: { dependency-type: development }
      runtime-dependencies: { dependency-type: production }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Neue Node-Hauptversion (z. B. 24 → 26) nur bewusst wechseln, wenn sie LTS ist;
      # Updates innerhalb von Node 24 (Sicherheitsfixes) kommen weiterhin
      - dependency-name: node
        update-types: ["version-update:semver-major"]
